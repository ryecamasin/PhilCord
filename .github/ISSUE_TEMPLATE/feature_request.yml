name: Feature Request
description: Have an idea for a new PhilCord feature? Request it here.
labels: [enhancement]
title: "[Feature] <title>"

body:
    - type: markdown
      attributes:
          value: |
            This form is not for any of the following:
            - Plugin requests that are unrelated to PhilCord
            - Feature requests for third-party plugins

    - type: textarea
      id: feature-description
      attributes:
          label: A clear and concise description of the feature you'd like to see
      validations:
          required: true

    - type: textarea
      id: implementation-notes
      attributes:
          label: Implementation Notes
          description: If you have ideas about how this could be implemented technically, share them here
      validations:
          required: false

    - type: textarea
      id: additional-context
      attributes:
          label: Additional context
          description: Screenshots, mockups, examples from other apps, etc.
      validations:
          required: false

    - type: checkboxes
      id: agreement-check
      attributes:
          label: Request Agreement
          options:
            - label: I've searched existing issues and this hasn't been suggested before
            - label: This is a **PhilCord feature**, not an unrelated third-party plugin request
            - label: This feature would benefit most users, not just a specific use case
            - label: I am willing to work on this myself
